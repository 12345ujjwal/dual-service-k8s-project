apiVersion: apps/v1
kind: Deployment

metadata:
  name: notes-deployment
  namespace: dev

spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes
  template:
    metadata:
      labels:
        app: notes
    spec:
      containers:
      - name: notes
        imagePullPolicy: IfNotPresent
        image: notes:latest
        ports:
        - containerPort: 8000
